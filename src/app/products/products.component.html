<div class="info-banner">PluralSight: <a href="https://app.pluralsight.com/ilx/video-courses/angular-signals/"
        target="_blank">Angular Signals</a></div>

<h1>{{pageTitle}}</h1>

<div class="content">

    <select id="productSelectList" [(ngModel)]="selectedProduct">
        <option value="undefined" selected>--Select a product--</option>
        @for(product of products(); track product.id) {
        <option [ngValue]="product">{{product.name}}</option>
        }
    </select>

    <div class="grid">
        <div class="row">
            <div class="cellLeft">Name:</div>
            <div class="cellRight">{{selectedProduct()?.name}}</div>
        </div>
        <div class="row">
            <div class="cellLeft">Description:</div>
            <div class="cellRight">{{selectedProduct()?.description}}</div>
        </div>
        <div class="row">
            <div class="cellLeft">Price:</div>
            <div class="cellRight">{{selectedProduct()?.price | currency}}</div>
        </div>
        <div class="row">
            <div class="cellLeft"><label for="quantity">Quantity:</label></div>
            <div class="cellRight">
                <div class="inputContainer">
                    <button class="qtyButton qtyButtonLeft" (click)="onDecrease()">-</button>
                    <input class="quantityInput" id="quantity" type="number" [(ngModel)]="quantity"
                        value="{{quantity()}}" />
                    <button class="qtyButton qtyButtonRight" (click)="onIncrease()">+</button>
                </div>

            </div>
        </div>
        <div class="row">
            <div class="cellLeft">Total:</div>
            <div class="cellRight">{{total() | currency}}</div>
        </div>
    </div>

    <div style="display: none;">
        <button (click)="setSelectedProduct()">Set Selected Product</button>
        |
        <button (click)="getSelectedProduct()">Get Selected Product</button>
        |
        <button (click)="getQuantity()">Get Quantity</button>
    </div>
</div>
