@let hasCartItems = cartItems().length > 0;
<div class="info-banner">PluralSight: <a href="https://app.pluralsight.com/ilx/video-courses/angular-foundations/"
        target="_blank">Angular Foundations</a></div>

<h1 class="header">Your Cart</h1>

@if(hasCartItems){
<button class="float-right hide" (click)="checkout.scrollIntoView()">Proceed to Checkout</button>
}
<ul>
    @for(product of cartItems(); track product.id){
    <li>
        <ab-product-details [product]="product">
            <button class="remove" (click)="removeFromCart(product)">Remove</button>
        </ab-product-details>
    </li>
    }@empty {<h2>No items in cart</h2>}
</ul>

<span #checkout>
    @if(hasCartItems){
    <button [disabled]="isButtonDisabled()" class="cta">Checkout</button>
    }
</span>
